<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>発注アシスタント</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="発注">
<meta name="theme-color" content="#1e293b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#1d2433; --sub:#5b6577; --line:#e2e8f0;
  --pri:#2563eb; --pri-weak:#e6efff; --ok:#15803d; --ok-weak:#dcfce7;
  --warn:#c2410c; --warn-weak:#ffedd5; --ng:#dc2626; --ng-weak:#fee2e2;
  --in:#fff8db; --in-line:#eab308;            /* 入力してほしい欄 */
  --accent:#2563eb; --accent-weak:#e6efff;     /* タブごとの色(body[data-tab]で切替) */
  --c-date:#2563eb; --c-date-weak:#eaf1ff;
  --c-stock:#16a34a; --c-stock-weak:#e8f8ee;
  --c-truck:#d97706; --c-truck-weak:#fff4e0;
}
body[data-tab="order"]{--accent:#2563eb;--accent-weak:#e6efff}
body[data-tab="sales"]{--accent:#059669;--accent-weak:#dff7ee}
body[data-tab="items"]{--accent:#ea580c;--accent-weak:#ffedd5}
body[data-tab="history"]{--accent:#7c3aed;--accent-weak:#efe7ff}
body[data-tab="settings"]{--accent:#475569;--accent-weak:#eef2f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
header{background:linear-gradient(90deg,#0f172a,#1e3a5f);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(15,23,42,.25);position:sticky;top:0;z-index:5;border-bottom:4px solid var(--accent)}
header h1{font-size:20px;margin:0;cursor:pointer;letter-spacing:.02em}
.home{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid #475569;background:#334155;color:#fff;cursor:pointer}
.home:hover{background:#475569}
.modal label.chk{display:flex;gap:8px;align-items:flex-start;margin:0 0 16px;font-size:15px;cursor:pointer}
.modal label.chk input{width:18px;height:18px;margin-top:3px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#cbd5e1;border:0;padding:8px 14px;border-radius:10px;font-size:16px;cursor:pointer;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button[data-tab="order"].on{background:#2563eb}
nav button[data-tab="sales"].on{background:#059669}
nav button[data-tab="items"].on{background:#ea580c}
nav button[data-tab="history"].on{background:#7c3aed}
nav button[data-tab="settings"].on{background:#64748b}
nav button.on{color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.file{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.file .fname{font-size:14px;color:#e2e8f0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .dirty{font-size:12px;background:#f59e0b;color:#1e293b;border-radius:999px;padding:1px 8px;font-weight:700}
.file button,.file .filebtn{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid #475569;background:#334155;color:#fff;cursor:pointer}
.file button:hover,.file .filebtn:hover{background:#475569}
.file button.p{background:var(--pri);border-color:#3b82f6}
main{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--accent)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--sub);gap:4px;font-weight:600}
input,select{font:inherit;padding:8px 10px;border:1.5px solid #b8c2d1;border-radius:8px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:0;border-color:var(--accent)}
input.num{width:90px;text-align:right}
input.wide{width:100%}
button.b{font:inherit;padding:8px 16px;border-radius:8px;border:1.5px solid #b8c2d1;background:#fff;cursor:pointer;transition:background .15s}
button.b:hover{background:#f1f4f8}
button.b:disabled{opacity:.45;cursor:default}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(37,99,235,.35)}
button.p:hover{background:#1d4fd7}
button.go{background:#16a34a;border-color:#16a34a;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(22,163,74,.35);padding:10px 20px;font-size:17px}
button.go:hover{background:#15803d}
button.d{color:var(--ng);border-color:#f0b4b4}
button.p.d{background:var(--ng);border-color:var(--ng);color:#fff}
button.sm{padding:4px 10px;font-size:14px}
.seg{display:inline-flex;border:1.5px solid #b8c2d1;border-radius:10px;overflow:hidden;background:#fff}
.seg button{font:inherit;padding:9px 14px;border:0;background:#fff;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1.5px solid #b8c2d1}
.seg #m-stock.on{background:var(--c-stock);color:#fff;font-weight:700}
.seg #m-truck.on{background:var(--c-truck);color:#fff;font-weight:700}
.seg button:hover:not(.on){background:#f1f4f8}
.seg button.stale{outline:3px solid #facc15;outline-offset:-3px}
.grip{cursor:grab;color:#94a3b8;font-size:20px;text-align:center;touch-action:none;user-select:none;width:28px}
.grip:hover{color:var(--accent)}
tr.dragging td{background:var(--accent-weak) !important;opacity:.9}
tr.dragging .grip{cursor:grabbing;color:var(--accent)}
.fmt{display:inline-flex;gap:2px;align-items:center}
.pm{width:38px;height:38px;padding:0;font-size:20px;line-height:1;font-weight:700}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:#334155;font-weight:700;background:var(--accent-weak);position:sticky;top:0}
tbody tr:nth-child(even) td{background:#f8fafc}
tbody tr:hover td{background:#f1f5fb}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
th.grp{font-size:12px;letter-spacing:.05em;text-align:center;border-bottom:0;padding:5px}
th.g-item{background:#e9edf3;color:#475569}
th.g-stock{background:var(--c-stock-weak);color:var(--c-stock)}
th.g-order{background:var(--in);color:#854d0e}
th.g-after{background:var(--c-date-weak);color:var(--c-date)}
td.in,th.in{background:var(--in) !important}
td.in input{border-color:var(--in-line);background:#fff}
tr.st-ok td:first-child{box-shadow:inset 5px 0 0 #22c55e}
tr.st-warn td:first-child{box-shadow:inset 5px 0 0 #f59e0b}
tr.st-ng td:first-child{box-shadow:inset 5px 0 0 #ef4444}
tr.st-none td:first-child{box-shadow:inset 5px 0 0 #cbd5e1}
tr.zero td:not(.in){color:#94a3b8}
.rank{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:800;font-size:15px;background:#e2e8f0;color:#475569}
.rank.r1{background:#facc15;color:#713f12}
.rank.r2{background:#cbd5e1;color:#1e293b}
.rank.r3{background:#f0b27a;color:#7c2d12}
.big{font-size:22px;font-weight:700}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;font-weight:700}
.t-ok{background:var(--ok-weak);color:var(--ok)}
.t-warn{background:var(--warn-weak);color:var(--warn)}
.t-ng{background:var(--ng-weak);color:var(--ng)}
.t-pri{background:var(--pri-weak);color:var(--pri)}
.t-none{background:#eef2f6;color:#64748b}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.panel{border-radius:12px;padding:12px 14px;border:1.5px solid}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
.panel .row{gap:12px}
.panel .sum{font-size:13px;margin-top:8px;color:#334155}
.p-date{background:var(--c-date-weak);border-color:#bfd4ff}.p-date h3{color:var(--c-date)}
.p-stock{background:var(--c-stock-weak);border-color:#b7e6c8}.p-stock h3{color:var(--c-stock)}
.p-truck{background:var(--c-truck-weak);border-color:#f6d39b}.p-truck h3{color:#b45309}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;border-top:5px solid #94a3b8;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.kpi.k-ok{border-top-color:#22c55e;background:linear-gradient(#f0fdf4,#fff 60%)}
.kpi.k-warn{border-top-color:#f59e0b;background:linear-gradient(#fff7ed,#fff 60%)}
.kpi.k-ng{border-top-color:#ef4444;background:linear-gradient(#fef2f2,#fff 60%)}
.kpi.k-blue{border-top-color:#3b82f6}
.kpi .l{font-size:13px;color:var(--sub);font-weight:600}
.kpi .v{font-size:30px;font-weight:800;line-height:1.2}
.kpi .v small{font-size:14px;font-weight:500;color:var(--sub);margin-left:4px}
.gauge{position:relative;height:40px;background:#e8edf3;border-radius:10px;margin:30px 0 24px}
.gauge .band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#bbf7d0,#bbf7d0 8px,#dcfce7 8px,#dcfce7 16px);border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
.gauge .fill{position:absolute;top:9px;bottom:9px;left:0;border-radius:6px;transition:width .25s}
.gauge .lbl{position:absolute;top:-24px;font-size:13px;font-weight:700;color:var(--ok);transform:translateX(-50%);white-space:nowrap}
.gauge .ax{position:absolute;bottom:-22px;font-size:12px;color:var(--sub);transform:translateX(-50%)}
.gauge .mk{position:absolute;top:-6px;bottom:-6px;width:4px;border-radius:2px;background:var(--ink);transform:translateX(-50%);transition:left .25s}
.gauge .now{position:absolute;top:50%;transform:translate(8px,-50%);font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap}
.cases{display:flex;align-items:center;gap:6px;justify-content:center}
.cases input{width:66px;text-align:center;font-size:19px;font-weight:800}
.empty{text-align:center;padding:32px;color:var(--sub)}
.note{background:var(--warn-weak);border:1px solid #fdba74;color:#7c2d12;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.note.ng{background:var(--ng-weak);border-color:#fca5a5;color:#7f1d1d}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:10px 0 0;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal p{margin:0 0 16px;white-space:pre-line}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.hint{font-size:13px;color:var(--sub);margin:8px 0 0}
.sales-grid td.cell{cursor:pointer}
.sales-grid td.cell:hover{background:var(--accent-weak) !important}
.voice{background:var(--accent-weak);border:1.5px solid #9fdcc4;border-radius:12px;padding:12px 14px;margin:12px 0}
.voice .row{gap:8px;align-items:center}
.mic{font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;border:0;background:#059669;color:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(5,150,105,.35)}
.mic.on{background:#dc2626;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
.vlog{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vlog .tag{font-weight:600}
.vlog button[data-ok]{border-color:var(--ok);color:var(--ok)}
.vlog button{font:inherit;font-size:13px;padding:2px 10px;border-radius:999px;border:1.5px solid var(--warn);background:#fff;color:var(--warn);cursor:pointer}
input.vset{animation:vset 1.6s}
input.guess{background:#fef08a !important;border-color:#ca8a04 !important;box-shadow:0 0 0 3px #fde047}
.vlog select{font:inherit;font-size:13px;padding:2px 6px;margin:0 4px}
@keyframes vset{0%{background:#bbf7d0;border-color:#16a34a}100%{background:#fff}}
@media (max-width:640px){
  main{padding:12px}
  .kpi .v{font-size:24px}
  th,td{padding:6px}
}
</style>
</head>
<body data-tab="order">
<header>
  <h1 id="h-title" title="ホームへ">📦 発注アシスタント</h1>
  <button class="home" id="h-home" title="発注提案の画面に戻る">🏠 ホーム</button>
  <nav id="nav">
    <button data-tab="order" class="on">📋 発注提案</button>
    <button data-tab="sales">✏️ 販売入力</button>
    <button data-tab="items">📦 商品・在庫</button>
    <button data-tab="history">🧾 発注履歴</button>
    <button data-tab="settings">⚙️ 設定</button>
  </nav>
  <div class="file">
    <span class="fname" id="f-name" title="">新規(未保存)</span><span class="dirty" id="f-dirty" hidden>未保存</span>
    <button id="f-new" title="空の新しいデータを作る">＋ 新規作成</button>
    <label class="filebtn" title="保存したファイル(.html)やバックアップ(.json)を開く">📂 開く<input type="file" id="f-open" accept=".html,.htm,.json,text/html,application/json" hidden></label>
    <button id="f-save" class="p" title="Ctrl+S">💾 上書き保存</button>
    <button id="f-saveas">名前を付けて保存</button>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"><div class="modal"><p id="modal-msg"></p><input id="modal-in" class="wide" hidden style="margin-bottom:16px"><label class="chk" id="modal-chk-l" hidden><input type="checkbox" id="modal-chk"><span id="modal-chk-t"></span></label><div class="acts"><button class="b" id="modal-no">キャンセル</button><button class="b p" id="modal-yes">OK</button></div></div></div>

<script type="application/json" id="saved-data">null</script>
<script>
'use strict';
// 保存ファイルを作るため、画面を書き換える前の HTML を控えておく
const PRISTINE = '<!doctype html>' + String.fromCharCode(10) + document.documentElement.outerHTML;
const KEY = 'sales-order-app-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const fmt = (n, d = 1) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('ja-JP');
const r2 = n => Math.round(n * 100) / 100;
const cv = n => r2(n).toFixed(2);   // 換算は小数第2位まで表示
const uid = () => Math.random().toString(36).slice(2, 10);

// ---- 日付 ----
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const md = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };

// ---- 状態 ----
const DEFAULT = {
  products: [],               // {id, name, caseQty, conv, stock}
  sales: {},                  // {'YYYY-MM-DD': {pid: 個数}}
  orders: [],                 // {id, date, nextDate, items:[{pid,name,cases,pieces,conv}], total}
  settings: { nextOrderDate: addDays(today(), 3), leadDays: 1, safetyDays: 1, avgDays: 7, truckMin: 45, truckMax: 55, targetDays: null },
};
let tab = 'order';
let draft = null;               // 発注提案の手修正 {pid: cases}
let mode = 'stock';             // 'stock' 入荷後在庫の目標で計算 / 'truck' 換算目標に合わせる
let orderDate = today();
let salesDate = today();
// 保存ファイルの情報。ファイルから開いた場合は埋め込みデータを使う
const EMB = (() => { try { return JSON.parse(document.getElementById('saved-data').textContent); } catch (e) { return null; } })();
let doc = EMB ? { id: EMB.docId, name: EMB.name, savedAt: EMB.savedAt } : { id: null, name: null, savedAt: null };
let fileHandle = null;          // 上書き保存先(このセッションで保存したファイル)
let dirty = false;
const lsKey = () => doc.id ? `${KEY}:${doc.id}` : KEY;
// 音声認識が出しがちな表記を、商品名ごとに最初から呼び名として入れておく(一度だけ。消した呼び名は戻さない)
const YOMI_SEED = {
  'インカ': 'いんか、インカの目覚め、インカのめざめ', '有明海苔': 'ありあけのり、有明のり、有明',
  '鶏塩': 'とりしお、鳥塩、鶏しお、取り塩', 'アンチョビ': 'あんちょび、アンチョビー',
  'カリッとカレー': 'かりっとかれー、カリットカレー、かりっと', 'いもこまち': '芋こまち、芋小町、いも小町',
  '旅じゃが': 'たびじゃが、旅ジャガ', '七味家': 'しちみや、七味屋、七味や、しちみ家',
  'NEXT': 'ネクスト、ねくすと', 'たくみ': '巧、匠、拓海、拓実、タクミ',
  '16枚': '十六枚、じゅうろくまい、16まい', '13枚': '十三枚、じゅうさんまい、13まい',
  'さくさく塩': 'サクサク塩、さくさくしお、サクサクしお', 'さくさくレモン': 'サクサクレモン、さくさくれもん',
  'beeレモン': 'ビーレモン、Bレモン、びーれもん', 'beeカリー': 'ビーカリー、Bカリー、ビーカレー、beeカレー',
  'ミノ': 'みの、美濃、蓑', 'むんぽ': 'ムンポ、むんぼ、ムンボ', 'べに': '紅、ベニ',
  '発酵': 'はっこう、発行、発光', 'えびショコ': 'エビショコ、海老ショコ、えびチョコ、エビチョコ、海老チョコ',
  'クラショコ': 'クラチョコ、くらしょこ', '明太': 'めんたい、明太子、めんたいこ', '九州': 'きゅうしゅう、吸収',
  'トリュフ': 'とりゅふ、トリフ', '燻製': 'くんせい、薫製', 'ベーコン': 'べーこん',
  'ほたて': '帆立、ホタテ', '焼き塩': 'やきしお、焼塩、焼きしお', 'ざくざく紅': 'ザクザク紅、ざくざくべに、ザクザクべに',
};
function seedYomi(products) {
  products.forEach(p => {
    if (p.seeded || !YOMI_SEED[p.name]) return;
    const list = String(p.yomi || '').split(/[、,，\s]+/).filter(Boolean);
    YOMI_SEED[p.name].split('、').forEach(w => { if (!list.some(x => kana(x) === kana(w))) list.push(w); });
    p.yomi = list.join('、'); p.seeded = true;
  });
  return products;
}
let S = load();

function norm(s) { const o = { ...structuredClone(DEFAULT), ...s, settings: { ...DEFAULT.settings, ...s.settings } }; seedYomi(o.products); return o; }
function load() {
  if (EMB) { applyView(EMB.view); return norm(EMB.data); }
  try {
    const s = JSON.parse(localStorage.getItem(KEY));

  } catch (e) {}

}

// ---- 計算 ----
// 直近 avgDays 回分の入力日で平均(入力の無い商品は 0 個として数える)
function salesDates() { return Object.keys(S.sales).sort().reverse(); }
function avgDaily(pid) {
  const ds = salesDates().slice(0, S.settings.avgDays);
  if (!ds.length) return 0;
  return ds.reduce((a, d) => a + num(S.sales[d][pid]), 0) / ds.length;
}

// 入荷後在庫の目標日数(全体)。未設定なら 発注間隔 + 安全在庫日数
const autoTarget = interval => interval + S.settings.safetyDays;
const globalTarget = interval => S.settings.targetDays ?? autoTarget(interval);

function plan() {
  const st = S.settings;
  const interval = Math.max(0, diffDays(orderDate, st.nextOrderDate));
  const target = globalTarget(interval);
  const rows = S.products.map(p => {
    const avg = avgDaily(p.id);
    const tDays = p.targetDays ?? target;
    // 納品までに売れる分(avg × leadDays)を引いた残りに、入荷後 tDays 日分を足す
    const need = Math.max(0, avg * (st.leadDays + tDays) - p.stock);
    const base = p.caseQty > 0 ? Math.ceil(need / p.caseQty - 1e-9) : 0;
    return { p, avg, tDays, need, base, cases: base };
  });
  // 売上の多い順に並べ、順位をつける
  rows.sort((a, b) => b.avg - a.avg);
  rows.forEach((r, i) => { r.rank = r.avg > 0 ? i + 1 : null; });
  if (mode === 'truck') adjustToTruck(rows, interval);
  return { interval, target, rows };
}

// 入荷時点の在庫が何日分か(納品までに売れる分を差し引く)
const daysAfter = (r, c) => r.avg > 0 ? (r.p.stock - r.avg * S.settings.leadDays + c * r.p.caseQty) / r.avg : Infinity;
const totalOf = rows => rows.reduce((a, r) => a + r.cases * r.p.conv, 0);
const OVER = 1.5;   // 積載合わせで足すときは目標日数の1.5倍までを優先

// 換算合計が min〜max に入るようケース数を増減する。売上の多い商品を優先する
function adjustToTruck(rows, interval) {
  const { truckMin: lo, truckMax: hi } = S.settings;
  const usable = rows.filter(r => r.p.conv > 0 && r.p.caseQty > 0);
  if (!usable.length) return;
  const byAvg = (pool, desc) => pool.reduce((a, b) => (desc ? b.avg > a.avg : b.avg < a.avg) ? b : a);
  let guard = 2000;
  // 足りない → 売上の多い商品から1ケースずつ追加(目標日数の1.5倍を超えるものは後回し)
  while (totalOf(rows) < lo - 1e-9 && guard--) {
    const t = totalOf(rows);
    let cands = usable.filter(r => r.avg > 0);
    if (!cands.length) cands = usable;
    const fit = cands.filter(r => t + r.p.conv <= hi + 1e-9);
    const pool = fit.length ? fit : [cands.reduce((a, b) => (b.p.conv < a.p.conv ? b : a))];
    const room = pool.filter(r => daysAfter(r, r.cases + 1) <= r.tDays * OVER);
    const pick = room.length ? byAvg(room, true)
      : pool.reduce((a, b) => (daysAfter(b, b.cases + 1) / b.tDays < daysAfter(a, a.cases + 1) / a.tDays ? b : a));
    pick.cases++;
  }
  // 多すぎる → 売上の少ない商品から1ケースずつ減らす(まず次回入荷まで欠品しない範囲で)
  while (totalOf(rows) > hi + 1e-9 && guard--) {
    const t = totalOf(rows);
    const cands = usable.filter(r => r.cases > 0);
    if (!cands.length) break;
    const safe = cands.filter(r => daysAfter(r, r.cases - 1) >= interval);
    let pool = safe.length ? safe : cands;
    const fit = pool.filter(r => t - r.p.conv >= lo - 1e-9);
    if (fit.length) pool = fit;
    byAvg(pool, false).cases--;
  }
}

let toastT;

function ask(msg, yes = 'OK', danger = false) {
  return new Promise(res => {
    $('#modal-msg').textContent = msg;
    const y = $('#modal-yes'), n = $('#modal-no');
    y.textContent = yes; y.classList.toggle('d', danger);
    const done = v => { $('#modal').classList.remove('on'); y.onclick = n.onclick = null; res(v); };
    y.onclick = () => done(true); n.onclick = () => done(false);
    $('#modal').classList.add('on'); y.focus();
  });
}

}

    // 次の発注に備えて日付を進める(同じ間隔で)
    const iv = Math.max(1, P.interval);
    orderDate = st.nextOrderDate;
    st.nextOrderDate = addDays(orderDate, iv);
    save(); draft = null;
    toast(`発注を確定し在庫に加算しました。次回は ${md(orderDate)}、その次を ${md(st.nextOrderDate)} に仮設定しています`);
    render();
  };
}

// ---- 音声入力 ----
// 「インカ 50、アンチョビ 20」→ [{name:'インカ', q:50}, …] にして、近い名前の商品の欄へ入れる
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
// 比べやすい形に:全角半角をそろえ、カタカナ→ひらがな、記号・空白・長音を除く
function kana(s) { return String(s ?? '').normalize('NFKC').toLowerCase()
  .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
  .replace(/[\s・.,、。ー\-_()（）「」'"!?！？]/g, ''); }
function kanjiNum(s) {
  const D = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 }, U = { '十': 10, '百': 100, '千': 1000 };
  let total = 0, cur = 0;
  for (const c of s) { if (c in D) cur = cur * 10 + D[c]; else { total += (cur || 1) * U[c]; cur = 0; } }
  return total + cur;
}
// 名前に数字・漢数字が入る商品(16枚・十六枚・七味家 など)は、先に記号へ置き換えてから数を拾う
function protectNames(t) {
  const keys = [...new Set(S.products.flatMap(p => [p.name, ...String(p.yomi || '').split(/[、,，\s]+/)]))]
    .map(k => k.normalize('NFKC').replace(/\s+/g, '')).filter(k => /[\d〇一二三四五六七八九十百千]/.test(k)).sort((a, b) => b.length - a.length);
  const map = {};
  keys.forEach((k, i) => {
    const ch = String.fromCharCode(0xE000 + i);
    const re = new RegExp([...k].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s*'), 'gi');
    t = t.replace(re, m => { map[ch] = m; return ch; });
  });
  return { t, back: s => s.replace(/[-]/g, c => map[c] ?? c) };
}
// 「むんぽ 2」が「むんぼに」のように、数がかなで名前にくっついて認識されることがある
const KN_D = { 'いち': 1, 'いっ': 1, 'に': 2, 'さん': 3, 'よん': 4, 'し': 4, 'ご': 5, 'ろく': 6, 'ろっ': 6, 'なな': 7, 'しち': 7, 'はち': 8, 'はっ': 8, 'きゅう': 9, 'く': 9 };
const KN_U = { 'じゅう': 10, 'じゅっ': 10, 'ひゃく': 100, 'びゃく': 100, 'ぴゃく': 100, 'せん': 1000, 'ぜん': 1000 };
const KN_T = { 'ひとつ': 1, 'ふたつ': 2, 'みっつ': 3, 'よっつ': 4, 'いつつ': 5, 'むっつ': 6, 'ななつ': 7, 'やっつ': 8, 'ここのつ': 9, 'とお': 10 };
const KN_W = [...Object.keys(KN_D), ...Object.keys(KN_U)].sort((a, b) => b.length - a.length).join('|');
const KN_RE = new RegExp(`(?:${Object.keys(KN_T).join('|')}|(?:${KN_W})+)(?:こ|個)?(?=[\\s、,。.]|$)`, 'g');
function kanaNum(s) {
  s = s.replace(/(こ|個)$/, '');
  if (s in KN_T) return KN_T[s];
  const toks = s.match(new RegExp(KN_W, 'g')) || [];
  if (toks.join('') !== s) return null;
  let total = 0, cur = 0, seen = false;
  for (const w of toks) {
    if (w in KN_D) { if (seen) return null; cur = KN_D[w]; seen = true; }   // 「にに」などは数ではない
    else { total += (cur || 1) * KN_U[w]; cur = 0; seen = false; }
  }
  return total + cur;
}
const hira = s => s.toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));   // 長さは変えない
function bestScore(said) {
  const s = kana(said); if (!s) return 0;
  return Math.max(0, ...S.products.map(p => Math.max(...[p.name, ...String(p.yomi || '').split(/[、,，\s]+/)].map(k => scoreKey(kana(k), s)))));
}
// 名前のすぐ後ろのかなの数を数字にする。ただし外した方が商品名によく合うときだけ(「いもこまち」の「ち」などは触らない)
function kanaNums(t) {
  const h = hira(t), cuts = [];
  let mt;
  KN_RE.lastIndex = 0;
  while ((mt = KN_RE.exec(h))) {
    const retry = () => { KN_RE.lastIndex = mt.index + 1; };   // 「べにろく」→「にろく」で外れたら「ろく」から探し直す
    const v = kanaNum(mt[0]); if (v == null || v === 0) { retry(); continue; }
    const head = h.slice(0, mt.index), from = Math.max(head.search(/[^\s、,。.\d\uE000-\uF8FF]*$/), 0);
    const pre = head.slice(from).trim();
    if (pre && !(bestScore(pre) >= 55 && bestScore(pre) > bestScore(pre + mt[0]))) { retry(); continue; }
    cuts.push([mt.index, mt[0].length, v]);
  }
  for (const [i, n, v] of cuts.reverse()) t = t.slice(0, i) + ` ${v} ` + t.slice(i + n);
  return t;
}
function parseVoice(text) {
  const pr = protectNames(String(text).normalize('NFKC'));
  // 漢数字は区切り・「個」・末尾の直前にあるものだけ数として扱う(商品名の「一番」などは残す)
  const t = kanaNums(pr.t.replace(/[〇零一二三四五六七八九十百千]+(?=\s*(?:個|ケース|本|つ|枚|袋|[、,。.\s]|$))/g, kanjiNum));
  const out = [];
  // 数のすぐ後に英字が続くもの(2L・500ml など)は商品名の一部とみなす
  const re = /\d+(?![\d.]*[a-zA-Z%])/g;
  let last = 0, mt;
  const clean = s => pr.back(s.replace(/^[\s、,。.・]*(?:個|ケース|本|つ|枚|袋|こ(?=[\s、,。.]|$))?[\s、,。.・]*/, '').trim());
  while ((mt = re.exec(t))) {
    const name = clean(t.slice(last, mt.index));
    const after = t.slice(re.lastIndex);
    const cs = /^\s*ケース/.test(after);
    last = re.lastIndex;
    if (name) out.push({ name, q: Number(mt[0]), cs });
  }
  const rest = clean(t.slice(last));
  if (rest) out.push({ name: rest, q: null });
  return out;
}
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const tmp = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return d[b.length];
}
function scoreKey(k, s) {
  if (!k || !s) return 0;
  if (k === s) return 100;
  if (s.length >= 2 && k.startsWith(s)) return 88;
  if (s.length >= 2 && k.includes(s)) return 78;
  if (k.length >= 2 && s.includes(k)) return 72;
  const sim = 1 - lev(k, s) / Math.max(k.length, s.length);
  const pre = 1 - lev(k.slice(0, s.length), s) / s.length;   // 言い切らなかった場合(略称)
  return Math.max(sim >= 0.5 ? 65 * sim : 0, s.length >= 2 && pre >= 0.6 ? 60 * pre : 0);
}
function matchProduct(said) {
  const s = kana(said);
  const sc = S.products.map(p => ({ p, v: Math.max(...[p.name, ...String(p.yomi || '').split(/[、,，\s]+/)].map(k => scoreKey(kana(k), s))) }))
    .filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  if (!sc.length) return { cands: [] };
  const top = sc.filter(x => x.v >= sc[0].v - 3);
  return top.length === 1 ? { p: top[0].p } : { cands: top.slice(0, 4).map(x => x.p) };
}
function learnYomi(p, said) {
  const w = String(said || '').replace(/\s+/g, ''), k = kana(w);
  if (!k) return false;
  const list = String(p.yomi || '').split(/[、,，\s]+/).filter(Boolean);
  if (kana(p.name) === k || list.some(x => kana(x) === k)) return false;
  list.push(w); p.yomi = list.join('、'); save();
  return true;
}
// 合う商品が無いとき、文字の近さで一番近い商品を予想する(近いものが無ければ null)
function guessProduct(said) {
  const s = kana(said); if (!s) return null;
  let best = null, bv = 0;
  S.products.forEach(p => [p.name, ...String(p.yomi || '').split(/[、,，\s]+/)].forEach(k => {
    k = kana(k); if (!k) return;
    const sim = 1 - lev(k, s) / Math.max(k.length, s.length);
    const pre = s.length >= 2 ? 1 - lev(k.slice(0, s.length), s) / s.length : 0;
    const v = Math.max(sim, pre * 0.9);
    if (v > bv) { bv = v; best = p; }
  }));
  return bv >= 0.34 ? best : null;
}
// guess=true は予想で入れた欄(保存前に確認するため黄色で残す)。予想前の値は data-prev に控える
function setSale(root, pid, q, guess = false) {
  const i = root.querySelector(`[data-sale="${pid}"]`); if (!i) return;
  if (guess && !i.classList.contains('guess')) i.dataset.prev = i.value;
  if (!guess) delete i.dataset.prev;
  i.value = q; i.classList.toggle('guess', guess);
  i.classList.remove('vset'); void i.offsetWidth; i.classList.add('vset');
}
function unguess(root, pid) {
  const i = root.querySelector(`[data-sale="${pid}"]`); if (!i || !i.classList.contains('guess')) return;
  i.value = i.dataset.prev ?? ''; delete i.dataset.prev; i.classList.remove('guess');
}
function applyVoice(text, root) {
  const log = $('#v-log'); if (!log) return;
  const items = parseVoice(text);
  if (!items.length) { log.innerHTML = ''; return; }
  const got = new Map(), guessed = new Map(), msgs = [];
  items.forEach(it => {
    if (it.q == null) { msgs.push(`<span class="tag t-warn">「${esc(it.name)}」の数が聞き取れません</span>`); return; }
    const m = matchProduct(it.name);
    if (m.p) { got.set(m.p.id, it.cs ? it.q * m.p.caseQty : it.q); return; }
    const said = esc(it.name.replace(/\s+/g, '')), cs = it.cs ? 1 : 0;
    const g = !m.cands.length && guessProduct(it.name);
    if (g) {
      guessed.set(g.id, it.cs ? it.q * g.caseQty : it.q);
      msgs.push(`<span class="tag t-warn">△「${said}」${it.q}${it.cs ? 'ケース' : ''} → 予想:<select data-learn="${said}" data-q="${it.q}" data-cs="${cs}" data-was="${g.id}">${S.products.map(p => `<option value="${p.id}"${p === g ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="-">(入れない)</option></select><button data-ok="${g.id}" data-said="${said}">合ってる</button></span>`);
      return;
    }
    if (!m.cands.length) { msgs.push(`<span class="tag t-ng">「${said}」${it.q}${it.cs ? 'ケース' : ''} はどれ? <select data-learn="${said}" data-q="${it.q}" data-cs="${cs}"><option value="">商品を選ぶ…</option>${S.products.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></span>`); return; }
    msgs.push(`<span class="tag t-warn">「${said}」${it.q}${it.cs ? 'ケース' : ''} はどれ? ${m.cands.map(p => `<button data-pick="${p.id}" data-said="${said}" data-q="${it.q}" data-cs="${cs}">${esc(p.name)}</button>`).join(' ')}</span>`);
  });
  guessed.forEach((q, pid) => { if (!got.has(pid)) setSale(root, pid, q, true); });
  got.forEach((q, pid) => setSale(root, pid, q));
  log.innerHTML = [...got].map(([pid, q]) => `<span class="tag t-ok">✓ ${esc(prod(pid).name)} ${q}</span>`).join('') + msgs.join('');
}
// 候補のうち「合う商品+数」が一番多く読めるものを選ぶ(同点なら認識側の第1候補)
function pickAlt(r) {
  let best = r[0].transcript, bv = -Infinity;
  for (let i = 0; i < r.length; i++) {
    const v = parseVoice(r[i].transcript).reduce((a, it) => a + (it.q != null && matchProduct(it.name).p ? 2 : -1), 0);
    if (v > bv) { bv = v; best = r[i].transcript; }
  }
  return best;
}
function startVoice(root) {
  try {
    rec = new SR(); rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 5;
  } catch (e) { rec = null; toast('音声認識を開始できませんでした'); return; }
  const btn = $('#v-mic'), box = $('#v-text');
  btn.classList.add('on'); btn.textContent = '■ 止める';
  // 毎回それまでの全文を解析し直す(同じ商品は後の数で上書きなので、何度反映しても結果は同じ)
  rec.onresult = e => {
    let fin = '', mid = '';
    for (const r of e.results) (r.isFinal ? (fin += pickAlt(r) + ' ') : (mid += r[0].transcript));
    box.value = (fin + mid).trim();
    if (fin) applyVoice(fin, root);
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'マイクの使用が許可されていません(設定で許可してください)' : `音声認識エラー: ${e.error}`);
  };
  rec.onend = () => {
    rec = null;
    if (btn.isConnected) { btn.classList.remove('on'); btn.textContent = '🎤 話して入力'; applyVoice(box.value, root); }
  };
  rec.start();
}
function stopVoice() { if (rec) rec.stop(); }

// 保存したファイルをまたいで使えるよう、ブラウザ内に別枠で持つ(保存ファイルにも同梱する)
const FMT_KEY = KEY + ':formats';
function loadFormats() { try { return JSON.parse(localStorage.getItem(FMT_KEY)) || []; } catch (e) { return []; } }
function saveFormats(list) { try { localStorage.setItem(FMT_KEY, JSON.stringify(list)); } catch (e) { toast('フォーマットを保存できませんでした'); } }
function mergeFormats(list) {
  if (!Array.isArray(list)) return;
  const cur = loadFormats();
  list.forEach(f => { if (!cur.some(c => c.id === f.id)) cur.push(f); });
  saveFormats(cur);
}
// フォーマットの商品を追加(同じ名前の商品があれば飛ばす)
function applyFormat(id) {
  const f = loadFormats().find(x => x.id === id); if (!f) return;
  let n = 0;
  f.items.forEach(it => {
    if (S.products.some(p => p.name === it.name)) return;
    S.products.push({ id: uid(), name: it.name, caseQty: it.caseQty, conv: it.conv, stock: 0, ...(it.yomi ? { yomi: it.yomi } : {}), ...(it.targetDays != null ? { targetDays: it.targetDays } : {}) });
    n++;
  });
  save(); draft = null; render();
  toast(n ? `「${f.name}」から ${n} 品目を追加しました${n < f.items.length ? `(${f.items.length - n} 品目は登録済みのため省略)` : ''}` : 'すべて登録済みです');
}
function formatButtons() {
  const fs = loadFormats();
  return fs.length ? fs.map(f => `<button class="b" data-fmt="${f.id}" title="${esc(f.items.map(i => i.name).join('、'))}">＋ ${esc(f.name)}(${f.items.length}品目)</button>`).join(' ') : '';
}
function bindFormatButtons(root) { root.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => applyFormat(b.dataset.fmt)); }

    const row = g.closest('tr');
    row.classList.add('dragging');
    const move = ev => {
      const rows = [...body.children].filter(r => r !== row);
      const next = rows.find(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (next) { if (row.nextElementSibling !== next) body.insertBefore(row, next); }
      else if (body.lastElementChild !== row) body.appendChild(row);
    };

      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      row.classList.remove('dragging');
      const ids = [...body.children].map(r => r.dataset.row);

      S.products.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));

    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });

// ---- ファイル保存 ----
function fileBar() {
  $('#f-name').textContent = doc.name ? `📄 ${doc.name}` : '新規(未保存)';
  $('#f-name').title = doc.savedAt ? `最終保存 ${new Date(doc.savedAt).toLocaleString('ja-JP')}` : '';
  $('#f-dirty').hidden = !(dirty && doc.name);
  document.title = (doc.name ? doc.name.replace(/\.html?$/i, '') + ' - ' : '') + '発注アシスタント';
}
// アプリ本体 + 現在のデータ + 開いていた画面 を1つの HTML にする
function buildFile() {
  const payload = { docId: doc.id, name: doc.name, savedAt: doc.savedAt, data: S, view: view(), formats: loadFormats() };
  const json = JSON.stringify(payload).replace(/</g, String.fromCharCode(92) + 'u003c');
  return PRISTINE.replace(/<script type="application\/json" id="saved-data">[\s\S]*?<\/script>/,
    () => `<script type="application/json" id="saved-data">${json}<\/script>`);
}
async function writeFile(asNew) {
  const prev = { ...doc };
  if (!doc.id || asNew) doc.id = uid();
  doc.savedAt = Date.now();
  const suggested = (doc.name || `発注_${orderDate}`).replace(/\.html?$/i, '') + '.html';
  let picked = false;
  if (window.showSaveFilePicker) {
    // 保存先を選べる方法。使えない環境(埋め込み表示・権限など)ではダウンロード保存に切り替える
    try {
      if (asNew || !fileHandle) {
        fileHandle = await showSaveFilePicker({ suggestedName: suggested, types: [{ description: '発注データ(HTML)', accept: { 'text/html': ['.html'] } }] });
      }
      doc.name = fileHandle.name;
      const w = await fileHandle.createWritable(); await w.write(buildFile()); await w.close();
      picked = true;
    } catch (e) {
      if (e.name === 'AbortError') { doc = prev; return; }
      console.warn('showSaveFilePicker failed', e);
      fileHandle = null;
    }
  }
  try {
    if (!picked) {
      const name = await askText('保存する名前を入力してください(ダウンロードフォルダに保存されます)', suggested.replace(/\.html$/, ''));
      if (!name) throw new DOMException('', 'AbortError');
      doc.name = name.replace(/\.html?$/i, '') + '.html';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buildFile()], { type: 'text/html' }));
      a.download = doc.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  } catch (e) {
    doc = prev;
    if (e.name !== 'AbortError') toast('保存できませんでした:' + e.message);
    return;
  }
  dirty = false; save(); dirty = false; fileBar();
  toast(`「${doc.name}」に保存しました。このファイルを開くと今の画面に戻れます`);
}
$('#f-save').onclick = () => writeFile(false);
// ホーム = 発注提案の画面の先頭
const goHome = () => { tab = 'order'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
$('#h-home').onclick = goHome; $('#h-title').onclick = goHome;
// 保存したファイルを読み込む(iPad など、ファイルを直接開けない環境向け)
$('#f-open').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let payload = null;
  try {
    const text = await f.text();
    const m = text.match(/<script type="application\/json" id="saved-data">([\s\S]*?)<\/script>/);
    if (m) payload = JSON.parse(m[1]);
    else { const d = JSON.parse(text); if (Array.isArray(d.products)) payload = { data: d }; }
  } catch (_) {}
  if (!payload || !payload.data) { toast('発注アシスタントのファイルではないようです'); return; }
  if (S.products.length && (!doc.name || dirty) && !await ask(`今の内容は保存されていません。\n「${f.name}」を開くと今の内容は置き換わります。よろしいですか?`, '開く', true)) return;
  mergeFormats(payload.formats);
  S = norm(payload.data);
  doc = { id: payload.docId || uid(), name: payload.name || f.name.replace(/\.json$/i, '.html'), savedAt: payload.savedAt || Date.now() };
  fileHandle = null; draft = null; mode = 'stock';
  applyView(payload.view);
  save(); dirty = false; fileBar(); render(); window.scrollTo(0, 0);
  toast(`「${doc.name}」を開きました`);
};
$('#f-new').onclick = async () => {
  const unsaved = S.products.length && (!doc.name || dirty);
  const warn = unsaved ? (doc.name ? `「${doc.name}」に保存していない変更があります。` : '今の内容はまだファイルに保存されていません。') + `
必要なら先に「名前を付けて保存」してください。

` : '';
  const l = $('#modal-chk-l'), c = $('#modal-chk');
  l.hidden = !S.products.length; c.checked = true;
  $('#modal-chk-t').textContent = '商品の登録(商品名・入数・換算)と設定を引き継ぐ(在庫・販売実績・発注履歴は空にする)';
  const ok = await ask(warn + '新しいデータを作成します。', '新規作成', unsaved);
  l.hidden = true;
  if (!ok) return;
  const keep = S.products.length && c.checked;
  const next = structuredClone(DEFAULT);
  if (keep) {
    next.products = S.products.map(p => ({ ...p, id: p.id, stock: 0 }));
    next.settings = { ...S.settings };
  }
  S = next; doc = { id: uid(), name: null, savedAt: null }; fileHandle = null;
  draft = null; mode = 'stock'; orderDate = today(); salesDate = today();
  tab = keep ? 'items' : 'order';
  save(); dirty = false; fileBar(); render(); window.scrollTo(0, 0);
  toast(keep ? '新規作成しました。「商品・在庫」で今の在庫数を入力してください' : '新規作成しました');
};
$('#f-saveas').onclick = () => writeFile(true);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); writeFile(e.shiftKey); }
});
window.addEventListener('beforeunload', e => { if (dirty && doc.name) { e.preventDefault(); e.returnValue = ''; } });
function askText(msg, def) {
  const i = $('#modal-in'); i.hidden = false; i.value = def;
  const r = ask(msg, '保存').then(ok => { i.hidden = true; return ok ? i.value.trim() : null; });
  setTimeout(() => { i.focus(); i.select(); }, 0);
  i.onkeydown = e => { if (e.key === 'Enter') $('#modal-yes').click(); };
  return r;
}

// ---- サンプル ----
function loadSample() {
  const P = [['天然水 2L', 6, 1.5, 40, 22], ['緑茶 500ml', 24, 1, 70, 45], ['コーラ 500ml', 24, 1, 55, 30], ['缶コーヒー', 30, 0.8, 90, 38], ['スポーツドリンク 2L', 6, 1.5, 10, 9], ['炭酸水 500ml', 24, 1, 30, 14]];
  S = structuredClone(DEFAULT);
  S.products = P.map(([name, caseQty, conv, stock]) => ({ id: uid(), name, caseQty, conv, stock }));
  for (let i = 7; i >= 1; i--) {
    const d = addDays(today(), -i); S.sales[d] = {};
    S.products.forEach((p, k) => { S.sales[d][p.id] = Math.max(0, Math.round(P[k][4] * (0.75 + Math.random() * 0.5))); });
  }
  save(); draft = null; toast('サンプルデータを入れました'); goTab('order');
}

fileBar();
render();
if (EMB) {
  mergeFormats(EMB.formats);
  try {
    const l = JSON.parse(localStorage.getItem(lsKey()));
    if (l && l.at > EMB.savedAt + 1000) {
      ask(`このファイルには、前回 ${new Date(l.at).toLocaleString('ja-JP')} に編集して保存していない内容があります。
復元しますか?(キャンセルでファイルの内容のまま)`, '復元する').then(ok => {
        if (ok) { S = norm(l.data); applyView(l.view); dirty = true; fileBar(); render(); }
      });
    }
  } catch (e) {}
}
